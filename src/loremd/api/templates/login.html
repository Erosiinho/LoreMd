{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="login">
  <h1>Admin console</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ prefix }}/login">
    <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <label>Authenticator code <input type="text" name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="hint">Accounts are created on the server: <code>loremd admin create &lt;email&gt;</code>.</p>
</section>
{% endblock %}
