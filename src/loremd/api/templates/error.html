{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<div class="card empty">
  <h1>Something went wrong</h1>
  <p class="error">{{ message }}</p>
  <p><a class="button ghost" href="{{ prefix }}">Back to the console</a></p>
</div>
{% endblock %}
{% block bare %}
<section class="login">
  <h1>Something went wrong</h1>
  <p class="error">{{ message }}</p>
  <p><a href="{{ prefix }}/login">Log in</a></p>
</section>
{% endblock %}
