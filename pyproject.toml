[project]
name = "loremd"
version = "0.1.0"
description = "Mémoire partagée pour agents IA, en Markdown, auto-hébergée."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "starlette>=0.41",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "asyncpg>=0.30",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]
openai = ["httpx>=0.27"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
loremd = "loremd.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loremd"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["loremd"]
mypy_path = "src"
ignore_missing_imports = true
